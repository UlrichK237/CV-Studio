<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F7F7F5" id="theme-color-meta" />
    <title>CV Studio - Créateur de CV professionnel et lettre de motivation</title>
    <meta name="description" content="Créateur de CV professionnel et lettre de motivation assisté par IA avec modèles A4 et export PDF." />
    <meta property="og:title" content="CV Studio - Créateur de CV professionnel et lettre de motivation" />
    <meta property="og:description" content="Créateur de CV professionnel et lettre de motivation assisté par IA avec modèles A4 et export PDF." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;1,8..60,600&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('cvstudio_theme');
          var theme = stored;
          if (!theme || theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          document.documentElement.style.colorScheme = theme;
          var metaTheme = document.getElementById('theme-color-meta');
          if (metaTheme) {
            metaTheme.setAttribute('content', theme === 'dark' ? '#0E1014' : '#F7F7F5');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-page text-primary font-sans antialiased selection:bg-accent-soft selection:text-accent">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
